# dom0 owns the display, input devices, audio and the TPM.

# ACPI platform devices (AMDI0010 I2C controllers, AMD GPIO).
CONFIG_X86_AMD_PLATFORM_DEVICE=y
# The touchpad interrupt line is routed through the AMD GPIO controller.
CONFIG_PINCTRL_AMD=y
# Touchpad: HID over I2C, enumerated through ACPI.
CONFIG_I2C_HID_ACPI=m

# Radeon Vega (Renoir) iGPU. radeon does not support it.
CONFIG_DRM_AMDGPU=m
CONFIG_DRM_AMD_DC=y

# AMD firmware TPM (fTPM) uses the CRB interface, discrete TPMs use TIS.
CONFIG_TCG_CRB=m

CONFIG_SENSORS_K10TEMP=m

# HP_WMI (hotkeys, rfkill) moved behind this menu in Linux 6.1, so the
# upstream defconfig setting is silently dropped without it.
CONFIG_X86_PLATFORM_DRIVERS_HP=y
CONFIG_HP_WMI=m

# Internal digital microphone array is attached to the ACP, not HDA.
CONFIG_SND_SOC=m
CONFIG_SND_SOC_AMD_RENOIR=m
CONFIG_SND_SOC_AMD_RENOIR_MACH=m
