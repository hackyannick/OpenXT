# Hardware enablement for the HP EliteBook 845 G7 (AMD Ryzen 4000 "Renoir")
# on top of OpenXT master (xenclient-oe).

BBPATH .= ":${LAYERDIR}"

BBFILES += " \
    ${LAYERDIR}/recipes-*/*/*.bb \
    ${LAYERDIR}/recipes-*/*/*.bbappend \
"

BBFILE_COLLECTIONS += "openxt-elitebook-845g7"
BBFILE_PATTERN_openxt-elitebook-845g7 := "^${LAYERDIR}/"
# Above xenclient-oe (9) so our files (e.g. openxt.cfg) take precedence.
BBFILE_PRIORITY_openxt-elitebook-845g7 = "10"

LAYERVERSION_openxt-elitebook-845g7 = "1"
LAYERSERIES_COMPAT_openxt-elitebook-845g7 = "dunfell"

# Host Java for the Dojo build of the UI (see dojosdk-native_%.bbappend).
HOSTTOOLS_append = " java"

LAYERDEPENDS_openxt-elitebook-845g7 = " \
    core \
    xenclient-oe \
    vglass \
"
