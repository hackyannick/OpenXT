# Hardware enablement for AMD Ryzen laptops (HP EliteBook 845 G7, Lenovo
# ThinkPad Z13 Gen1)
# on top of OpenXT master (xenclient-oe).

BBPATH .= ":${LAYERDIR}"

BBFILES += " \
    ${LAYERDIR}/recipes-*/*/*.bb \
    ${LAYERDIR}/recipes-*/*/*.bbappend \
"

BBFILE_COLLECTIONS += "openxt-amd-laptops"
BBFILE_PATTERN_openxt-amd-laptops := "^${LAYERDIR}/"
# Above xenclient-oe (9) so our files (e.g. openxt.cfg) take precedence.
BBFILE_PRIORITY_openxt-amd-laptops = "10"

LAYERVERSION_openxt-amd-laptops = "1"
LAYERSERIES_COMPAT_openxt-amd-laptops = "dunfell"

# Host Java for the Dojo build of the UI (see dojosdk-native_%.bbappend).
HOSTTOOLS_append = " java"

LAYERDEPENDS_openxt-amd-laptops = " \
    core \
    xenclient-oe \
    vglass \
"
