# dom0 owns the display, input devices, audio and the TPM.
# Supported: HP EliteBook 845 G7 (Ryzen 4000 "Renoir"),
#            Lenovo ThinkPad Z13 Gen1 (Ryzen 6000 "Rembrandt").

# ACPI platform devices (AMDI0010 I2C controllers, AMD GPIO).
CONFIG_X86_AMD_PLATFORM_DEVICE=y
# Touchpad interrupt lines are routed through the AMD GPIO controller.
CONFIG_PINCTRL_AMD=y
# Touchpads (845 G7, Z13 ELAN ForcePad): HID over I2C, enumerated through ACPI.
CONFIG_I2C_HID_ACPI=m

# Radeon Vega (Renoir) and Radeon 660M/680M (Rembrandt) iGPUs.
# radeon supports neither.
CONFIG_DRM_AMDGPU=m
CONFIG_DRM_AMD_DC=y

# AMD firmware TPM (fTPM) and Pluton use the CRB interface, discrete TPMs TIS.
CONFIG_TCG_CRB=m

CONFIG_SENSORS_K10TEMP=m

# HP_WMI (hotkeys, rfkill) moved behind this menu in Linux 6.1, so the
# upstream defconfig setting is silently dropped without it.
CONFIG_X86_PLATFORM_DRIVERS_HP=y
CONFIG_HP_WMI=m

# Internal digital microphones are attached to the AMD ACP, not HDA:
# ACP3x/Renoir on the 845 G7, ACP6x/Yellow Carp on the Z13 (DMI 21D2/21D3).
CONFIG_SND_SOC=m
CONFIG_SND_SOC_AMD_RENOIR=m
CONFIG_SND_SOC_AMD_RENOIR_MACH=m
CONFIG_SND_SOC_AMD_ACP6x=m
CONFIG_SND_SOC_AMD_YC_MACH=m

# Z13 speakers: Realtek ALC287 with two Cirrus CS35L41 amplifiers on I2C
# (ACPI CSC3551, split into one I2C client per amp by serial-multi-instantiate,
# which needs the SPI core). Firmware: linux-firmware-cirrus-cs35l41.
CONFIG_SPI=y
CONFIG_SERIAL_MULTI_INSTANTIATE=m
CONFIG_SND_HDA_SCODEC_CS35L41_I2C=m
