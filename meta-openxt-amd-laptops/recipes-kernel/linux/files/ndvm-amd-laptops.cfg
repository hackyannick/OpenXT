# The NDVM gets the network controllers passed through.
# 845 G7: RTL8111 Ethernet (r8169) and Intel AX200 (iwlwifi) are enabled
# upstream; the Realtek RTL8822CE Wi-Fi option is not.
CONFIG_RTW88=m
CONFIG_RTW88_8822CE=m

# Z13 Gen1: Qualcomm WCN6855 (NFA725A) Wi-Fi 6E. ath11k_pci selects MHI/QRTR
# and falls back to a single MSI vector, which matters for passthrough.
CONFIG_WLAN_VENDOR_ATH=y
CONFIG_CRYPTO_MICHAEL_MIC=m
CONFIG_ATH11K=m
CONFIG_ATH11K_PCI=m
